<!-- ====================== -->
<!-- Favicon -->
<!-- ====================== -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">

<!-- ====================== -->
<!-- Apple Touch Icon -->
<!-- ====================== -->
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<!-- ====================== -->
<!-- PWA / App Icons -->
<!-- ====================== -->
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">

<!-- Optional: Maskable icon for Android -->
<link rel="icon" type="image/png" sizes="512x512" href="/icon-maskable-512.png">

<!-- ====================== -->
<!-- Open Graph (Facebook, LinkedIn, etc.) -->
<!-- ====================== -->
<meta property="og:type" content="website">
<meta property="og:title" content="Your App Name">
<meta property="og:description" content="Your app description here">
<meta property="og:image" content="https://yourdomain.com/og-image-1200x630.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://yourdomain.com">

<!-- ====================== -->
<!-- Twitter Card -->
<!-- ====================== -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your App Name">
<meta name="twitter:description" content="Your app description here">
<meta name="twitter:image" content="https://yourdomain.com/og-image-1200x630.png">
